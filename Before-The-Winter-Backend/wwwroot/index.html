<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Everything-Lost-Telegram</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-container">
        <div id="unity-loading-bar">
          <div id="unity-logo"></div>
          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      // --- Telegram Mini App: fill the whole window / screen ---
      (function () {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (!tg) return;

        var isMobile = tg.platform === "android" || tg.platform === "ios" || tg.platform === "android_x";
        var call = function (fn) { try { fn(); } catch (e) { console.warn(e); } };

        call(function () { tg.ready(); });
        // Expands the Mini App to the maximum available height / full window.
        call(function () { tg.expand(); });
        call(function () { tg.disableVerticalSwipes(); });

        // Fullscreen on every platform: on desktop the Mini App otherwise opens in a narrow portrait window.
        call(function () { tg.requestFullscreen(); });

        if (isMobile) {
          // Phone: landscape. tg.lockOrientation() locks the *current* orientation, so it must run only
          // after the screen is already landscape, otherwise it would lock portrait.
          var isLandscape = function () { return window.innerWidth > window.innerHeight; };
          var lockCurrent = function () { call(function () { tg.lockOrientation(); }); };

          // Drop a portrait lock Telegram may have remembered from an earlier launch.
          call(function () { tg.unlockOrientation(); });

          var rotated = false;
          call(function () {
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock("landscape").then(function () { rotated = true; }).catch(function () {});
            }
          });

          // Telegram cannot force a rotation, so ask the player to turn the phone and lock once they do.
          var hint = document.createElement("div");
          hint.textContent = "Поверніть телефон горизонтально";
          hint.style.cssText = "position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;" +
            "text-align:center;padding:24px;background:#231f20;color:#fff;font:600 22px sans-serif;";
          document.body.appendChild(hint);
          var updateHint = function () { hint.style.display = isLandscape() ? "none" : "flex"; };
          updateHint();
          window.addEventListener("resize", updateHint);

          // Lock as soon as the phone is turned sideways.
          var lockWhenLandscape = function () { if (isLandscape()) lockCurrent(); };
          window.addEventListener("resize", lockWhenLandscape);
          tg.onEvent("fullscreenChanged", function () { setTimeout(lockWhenLandscape, 300); });
          setTimeout(function () { if (rotated || isLandscape()) lockCurrent(); }, 500);
        }

        tg.onEvent("viewportChanged", function () { call(function () { tg.expand(); }); });
      })();

      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/wwwroot.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/wwwroot.data",
        frameworkUrl: buildUrl + "/wwwroot.framework.js",
        codeUrl: buildUrl + "/wwwroot.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Everything-Lost-Telegram",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
