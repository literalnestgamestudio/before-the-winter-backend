<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Перед зимою</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-container">
        <div id="unity-loading-bar">
          <div id="unity-logo"></div>
          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      // --- Telegram Mini App: fill the whole window / screen ---
      (function () {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (!tg) return;

        var isPhone = tg.platform === "android" || tg.platform === "ios" || tg.platform === "android_x";
        document.body.classList.toggle("phone", isPhone);
        var call = function (fn) { try { fn(); } catch (e) { console.warn(e); } };

        call(function () { tg.ready(); });
        // Expands the Mini App to the maximum available height / full window.
        call(function () { tg.expand(); });
        call(function () { tg.disableVerticalSwipes(); });

        if (isPhone) {
          call(function () { tg.requestFullscreen(); });
          call(function () {
            if (screen.orientation && screen.orientation.lock)
              screen.orientation.lock("portrait").catch(function () {});
          });
          var lockPortrait = function () {
            if (window.innerHeight >= window.innerWidth)
              call(function () { tg.lockOrientation(); });
          };
          lockPortrait();
          window.addEventListener("resize", lockPortrait);
        } else {
          call(function () { tg.unlockOrientation(); });
        }

        tg.onEvent("viewportChanged", function () { call(function () { tg.expand(); }); });
      })();

      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/wwwroot.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/wwwroot.data.br",
        frameworkUrl: buildUrl + "/wwwroot.framework.js.br",
        codeUrl: buildUrl + "/wwwroot.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Перед зимою",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((unityInstance) => {
          var unlockMusic = function () {
            unityInstance.SendMessage("Music", "UnlockAudio");
            window.removeEventListener("touchstart", unlockMusic);
            window.removeEventListener("mousedown", unlockMusic);
          };
          window.addEventListener("touchstart", unlockMusic);
          window.addEventListener("mousedown", unlockMusic);
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
